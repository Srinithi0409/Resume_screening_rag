<script src="https://cdn.tailwindcss.com"></script>

<div class="max-w-3xl mx-auto mt-10 bg-white shadow rounded-lg p-8">
  <h1 class="text-2xl font-bold mb-6">Apply for {{ job.title }}</h1>

  <form
    method="POST"
    enctype="multipart/form-data"
    action="{% url 'submit_application' job.id %}"
  >
    {% csrf_token %}

    <div class="grid gap-4">
      <input
        type="text"
        name="name"
        placeholder="Full Name"
        class="border p-3 rounded"
        required
      />

      <input
        type="email"
        name="email"
        placeholder="Email"
        class="border p-3 rounded"
        required
      />

      <input
        type="text"
        name="phone"
        placeholder="Phone Number"
        class="border p-3 rounded"
        required
      />

      <input
        type="text"
        name="college"
        placeholder="College Name"
        class="border p-3 rounded"
      />

      <input
        type="text"
        name="department"
        placeholder="Department"
        class="border p-3 rounded"
      />

      <select name="experience" class="border p-3 rounded">
        <option value="0-1 years">0-1 years</option>
        <option value="1-3 years">1-3 years</option>
        <option value="3-5 years">3-5 years</option>
        <option value="5+ years">5+ years</option>
      </select>

      <label class="font-medium">Upload Resume (PDF)</label>

      <input
        type="file"
        name="resume"
        accept=".pdf"
        class="border p-3 rounded"
      />

      <button class="bg-primary text-white px-6 py-3 rounded-lg mt-4">
        Apply
      </button>
    </div>
  </form>
</div>
